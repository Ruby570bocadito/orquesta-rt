# =============================================================================
# Despliegue on-prem de la plataforma (blueprint cap. 6.2)
# -----------------------------------------------------------------------------
# Un solo comando levanta todo el despliegue de referencia:
#
#   cp platform/.env.example platform/.env   # configurar claves
#   docker compose up -d                     # núcleo + consola
#   docker compose --profile lab up -d       # + objetivo simulado del lab
#   docker compose --profile gpu up -d       # + vLLM (inferencia local GPU)
#
# Servicios:
#   orquestador  : API FastAPI del núcleo (LangGraph, guardrails, memoria)
#   consola      : consola del operador (Next.js)
#   lab          : objetivo simulado ACME (solo perfil lab)
#   vllm         : LLM local de producción (solo perfil gpu, requiere GPU)
# =============================================================================

services:
  orquestador:
    build:
      context: ./platform
      dockerfile: Dockerfile
    container_name: orquesta-rt-nucleo
    env_file:
      - ./platform/.env
    environment:
      - RAIZ_CASOS=/datos/casos
      - RAIZ_SKILLS=/app/skills
      - USUARIOS_DB=/datos/usuarios.db
      - CONSOLE_ORIGINS=http://localhost:3000
    volumes:
      - datos_casos:/datos/casos
      - ./platform/skills:/app/skills:ro
      - ./platform/roe:/app/roe:ro
    ports:
      # z3 (auditoría seguridad): la API es INTERNA (la consola la consume
      # vía su proxy). Publicarla en 0.0.0.0 exponía el backend a internet
      # y permitía saltarse el proxy (y sus cabeceras de IP real). Solo
      # loopback en el host; si necesitas acceso externo, usa el proxy.
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/api/salud').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    # Endurecimiento de producción: sin privilegio extra, sin escritura
    # fuera del volumen de datos (las habilidades y el ROE van read-only).
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.0"

  consola:
    build:
      context: .
      dockerfile: Dockerfile.console
    container_name: orquesta-rt-consola
    environment:
      - ORCHESTRATOR_URL=http://orquestador:8000
      - NODE_ENV=production
    ports:
      - "3000:3000"
    depends_on:
      orquestador:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"

  # ---- Perfil: lab (objetivo simulado) ----
  lab-certificado:
    image: alpine/openssl
    profiles: ["lab"]
    entrypoint: >
      sh -c "
        mkdir -p /certs &&
        openssl req -x509 -newkey rsa:2048 -nodes -days 365 \
          -keyout /certs/lab.key -out /certs/lab.pem \
          -subj '/CN=lab.acme-demo.local' 2>/dev/null &&
        echo OK
      "
    volumes:
      - lab_certs:/certs

  lab-objetivo:
    image: nginx:1.24-alpine
    profiles: ["lab"]
    container_name: lab-acme-objetivo
    depends_on: [lab-certificado]
    volumes:
      - ./platform/lab/objetivo/index.html:/usr/share/nginx/html/index.html:ro
      - ./platform/lab/objetivo/robots.txt:/usr/share/nginx/html/robots.txt:ro
      - ./platform/lab/objetivo/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - lab_certs:/etc/nginx/certs
    # z3 (auditoría): loopback — mismo criterio que el orquestador desde la
    # sesión 1: nada del ejercicio se publica en todas las interfaces.
    ports:
      - "127.0.0.1:8443:443"
    restart: unless-stopped

  # ---- Perfil: gpu (inferencia local de producción) ----
  vllm:
    image: vllm/vllm-openai:latest
    profiles: ["gpu"]
    container_name: orquesta-rt-vllm
    command: >
      --model ${MODELO_LOCAL_DESCARGA:-Qwen/Qwen2.5-14B-Instruct}
      --served-model-name ${MODELO_LOCAL:-qwen2.5:14b}
      --max-model-len 32768
      --enable-prefix-caching
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
    volumes:
      - cache_modelos:/root/.cache/huggingface
    # z3 (auditoría): vLLM NO tiene autenticación — publicado en 0.0.0.0,
    # cualquier equipo de la red usaba el LLM local (y era objetivo de SSRF
    # interno). Loopback: la consola/orquestador lo alcanzan por la red docker
    # (http://vllm:8000) y el operador por 127.0.0.1:8001.
    ports:
      - "127.0.0.1:8001:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  datos_casos:
  lab_certs:
  cache_modelos:
