# =============================================================================
# Lab simulado — objetivo ficticio para probar la plataforma de forma segura
# -----------------------------------------------------------------------------
# Levanta un "ACME Corporación" falso con nginx: sitio estático, robots.txt
# con rutas reveladoras y cabeceras intencionadamente detectables.
#
#   docker compose -f docker-compose.lab.yml up -d
#   curl -k https://localhost/            # portal falso
#   curl -k https://localhost/robots.txt  # rutas del ejercicio
#
# El servidor MCP de recon (recon_server.py) apunta por defecto a este lab.
# TODO aquí es ficticio: no hay sistema real al otro lado.
# =============================================================================

services:
  lab-objetivo:
    image: nginx:1.24-alpine
    container_name: lab-acme-objetivo
    # z3 (auditoría): loopback — el objetivo del lab es un ejercicio interno;
    # publicarlo en todas las interfaces invita a terceros de la red al ruido
    # del ejercicio. Si compartes el lab, usa un túnel SSH o una ACL.
    ports:
      - "127.0.0.1:8443:443"
      - "127.0.0.1:8080:80"
    volumes:
      - ./objetivo/index.html:/usr/share/nginx/html/index.html:ro
      - ./objetivo/robots.txt:/usr/share/nginx/html/robots.txt:ro
      - ./objetivo/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - lab_certs:/etc/nginx/certs
    environment:
      - SERVIDOR_LAB=acme-demo (ficticio)
    restart: unless-stopped

  # Threat intel de laboratorio: API MISP compatible (subconjunto REST real)
  # para ejercitar el enriquecimiento threat-intel de extremo a extremo.
  # Clave del lab: clave-lab-misp (SOLO laboratorio; cámbiala con LAB_MISP_KEY).
  # En el backend: MISP_URL=http://lab-misp:9000  MISP_KEY=clave-lab-misp
  # z3 (auditoría): el puerto se publica SOLO en loopback — con la clave
  # por defecto débil, publicarlo en 0.0.0.0 exponía escritura del intel a
  # toda la red local. El backend lo alcanza por la red docker compartida
  # (lab-misp:9000) o por 127.0.0.1:8444 desde el propio host; si algún día
  # necesitas exponerlo, cambia la clave ANTES de abrir el bind.
  lab-misp:
    image: python:3.12-alpine
    container_name: lab-acme-misp
    entrypoint: >
      python3 /servidor_misp_lab.py --host 0.0.0.0 --puerto 9000
        --estado /estado/misp_lab.json
    volumes:
      - ./servidor_misp_lab.py:/servidor_misp_lab.py:ro
      - lab_misp_estado:/estado
    ports:
      - "127.0.0.1:8444:9000"
    restart: unless-stopped

  # Genera el certificado autofirmado del lab antes de arrancar nginx
  lab-certificado:
    image: alpine/openssl
    container_name: lab-acme-cert
    entrypoint: >
      sh -c "
        mkdir -p /certs &&
        openssl req -x509 -newkey rsa:2048 -nodes -days 365 \
          -keyout /certs/lab.key -out /certs/lab.pem \
          -subj '/CN=lab.acme-demo.local' 2>/dev/null &&
        echo 'Certificado del lab generado'
      "
    volumes:
      - lab_certs:/certs

volumes:
  lab_certs:
  lab_misp_estado:
