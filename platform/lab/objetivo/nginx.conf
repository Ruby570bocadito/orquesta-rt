server {
    listen 443 ssl;
    server_name lab.acme-demo.local;

    # Certificado autofirmado del lab (generado al primer arranque)
    ssl_certificate     /etc/nginx/certs/lab.pem;
    ssl_certificate_key /etc/nginx/certs/lab.key;

    # Cabeceras intencionadamente reveladoras: el lab mide el reconocimiento
    add_header Server "nginx/1.24.0";
    add_header X-Powered-By "PHP/8.2";

    root /usr/share/nginx/html;
    index index.html;

    location /admin   { return 403; }
    location /backup  { return 403; }
    location /staging { return 403; }
}

server {
    listen 80;
    server_name lab.acme-demo.local;
    return 301 https://$host$request_uri;
}
